[package]
name = "mru-monitor"
version = "1.0.0"
description = "Monitoramento, aquisição, calibração e produção do MRU"
authors = ["Klauss Marchi"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "mru_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
